services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: referral
      POSTGRES_PASSWORD: referral
      POSTGRES_DB: referral
    ports:
      - "5432:5432"
    volumes:
      - referral_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U referral"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  referral_pg:
